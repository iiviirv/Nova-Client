name: Build Windows

# Builds the Nova Client Windows desktop app (bundling the committed
# sing-box-windows-amd64 core) and uploads a ready-to-run Nova-Windows.zip as a
# workflow artifact. Runs on push to the desktop branch, can be triggered
# manually, and on a v* tag it also attaches Nova-Windows.zip to the public
# IRNova/Nova-Client release.
on:
  workflow_dispatch:
  push:
    # v* tags cut a public release; the desktop branch builds for dev. No path
    # filter: it would suppress tag builds (path filters and tags don't mix), and
    # the extra runs on the dev branch are harmless.
    tags: ["v*"]
    branches:
      - claude/macos-desktop-core

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # The sing-box core is no longer a Flutter asset (it bloated the mobile
      # builds), so place it next to the built .exe where DesktopProxyController
      # looks for it.
      - name: Bundle sing-box core next to the app
        run: Copy-Item assets/bin/sing-box-windows-amd64.exe -Destination build/windows/x64/runner/Release/ -Force

      # Xray is the second core, for xhttp/SplitHTTP exits sing-box can't run.
      # DesktopProxyController starts it next to the .exe; without it, xhttp
      # servers report "no Xray core" and every other protocol is unaffected.
      - name: Bundle Xray core next to the app
        run: Copy-Item assets/bin/xray-windows-amd64.exe -Destination build/windows/x64/runner/Release/ -Force

      # wintun.dll is required for TUN (full-device) mode; sing-box loads it from
      # beside the core. Proxy mode (the default) doesn't need it.
      - name: Bundle wintun.dll next to the app
        run: Copy-Item assets/bin/wintun.dll -Destination build/windows/x64/runner/Release/ -Force

      # libcronet.dll is Chromium's network stack, which the core loads (lazily,
      # from beside itself) for NaiveProxy servers. The Windows core is built
      # with purego so the Go side stays cross-compilable; the DLL is the native
      # half. See tool/core/build-desktop.sh. Without it a NaiveProxy server
      # fails with "cronet: library not found"; every other protocol is unaffected.
      - name: Bundle libcronet.dll next to the app
        run: Copy-Item assets/bin/libcronet.dll -Destination build/windows/x64/runner/Release/ -Force

      # Flutter links the MSVC runtime dynamically, so the .exe needs
      # vcruntime140_1.dll and friends present on the machine. A Windows user hit
      # "The code execution cannot proceed because VCRUNTIME140_1.dll was not
      # found" on 2026-08-25: the app died before a line of Nova code ran, purely
      # because that PC had no Visual C++ Redistributable installed. Telling every
      # user to go install one first is not a fix. Microsoft supports shipping the
      # CRT beside the executable (app-local deployment), which is exactly what
      # the Redist folder in Visual Studio exists for, so copy it into the bundle
      # and stop depending on what the machine happens to already have.
      - name: Bundle the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          # Locate the CRT by the DLL we actually need, not by a toolset folder
          # name: the runner moved from VS17 to VS18 and "Microsoft.VC143.CRT"
          # stopped existing, which broke the first version of this step.
          # Exclude onecore/debug/spectre variants, which are not what a normal
          # desktop build links against.
          $found = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter vcruntime140_1.dll -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|debug|spectre' }
          if (-not $found) { Write-Error "no x64 CRT redist found under $vs\VC\Redist\MSVC"; exit 1 }
          # Newest wins. The runner ships several redist versions side by side,
          # and taking whichever the directory walk hit first picked a 14.29 CRT
          # for a binary built with the 14.51 toolset. Too-old is not a harmless
          # mismatch: the exe can reference exports the older CRT never had, and
          # that surfaces as "entry point not found" rather than a clear error.
          # FileVersion reads "14.29.30157.0 built by: cloudtest" on these DLLs,
          # so take the numeric prefix before comparing; the raw string will not
          # cast to [version].
          $dll = $found | Sort-Object { [version](($_.VersionInfo.FileVersion -split ' ')[0]) } -Descending | Select-Object -First 1
          Write-Host "CRT version $($dll.VersionInfo.FileVersion)"
          $crt = $dll.Directory.FullName
          Write-Host "copying the CRT from $crt"
          Copy-Item "$crt\*.dll" -Destination build/windows/x64/runner/Release/ -Force
          Get-ChildItem "$crt\*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

      # "It built" is not "it starts on someone else's PC", and that is the exact
      # gap the missing CRT fell through. Fail the build here rather than shipping
      # another zip that dies on launch.
      - name: Verify the bundle is complete
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          $need = @(
            'nova_client.exe', 'flutter_windows.dll',
            'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll',
            'sing-box-windows-amd64.exe', 'xray-windows-amd64.exe',
            'wintun.dll', 'libcronet.dll'
          )
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { Write-Error "missing from the bundle: $($missing -join ', ')"; exit 1 }
          Write-Host "all $($need.Count) required files are present"

      - name: Package Nova-Windows.zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Nova-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows
          path: Nova-Windows.zip
          if-no-files-found: error

      # On a v* tag, attach the Windows build to the public IRNova release, next
      # to the APK and macOS builds. Notes come from the CHANGELOG section for the
      # tag (same body the APK job writes), via the IRNOVA_TOKEN PAT.
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tool/release_notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > notes.md

      # Publish here first with the built-in token, so a release always lands
      # even if the cross-org PAT below has expired.
      - name: Publish the Windows build here
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: Nova-Windows.zip
          body_path: notes.md
          generate_release_notes: false

      # Mirror to IRNova (where the website's download links point). Non-fatal:
      # an expired IRNOVA_TOKEN must not fail an otherwise good release.
      - name: Mirror the Windows build to the IRNova release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: IRNova/Nova-Client
          token: ${{ secrets.IRNOVA_TOKEN }}
          files: Nova-Windows.zip
          body_path: notes.md
          generate_release_notes: false
