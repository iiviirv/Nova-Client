name: Build Windows

# Builds the Nova Client Windows desktop app (bundling the committed
# sing-box-windows-amd64 core) and uploads a ready-to-run Nova-Windows.zip as a
# workflow artifact. Runs on push to the desktop branch, can be triggered
# manually, and on a v* tag it also attaches Nova-Windows.zip to the public
# IRNova/Nova-Client release.
on:
  workflow_dispatch:
  push:
    # v* tags cut a public release; the desktop branch builds for dev. No path
    # filter: it would suppress tag builds (path filters and tags don't mix), and
    # the extra runs on the dev branch are harmless.
    tags: ["v*"]
    branches:
      - claude/macos-desktop-core

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # The sing-box core is no longer a Flutter asset (it bloated the mobile
      # builds), so place it next to the built .exe where DesktopProxyController
      # looks for it.
      - name: Bundle sing-box core next to the app
        run: Copy-Item assets/bin/sing-box-windows-amd64.exe -Destination build/windows/x64/runner/Release/ -Force

      # Xray is the second core, for xhttp/SplitHTTP exits sing-box can't run.
      # DesktopProxyController starts it next to the .exe; without it, xhttp
      # servers report "no Xray core" and every other protocol is unaffected.
      - name: Bundle Xray core next to the app
        run: Copy-Item assets/bin/xray-windows-amd64.exe -Destination build/windows/x64/runner/Release/ -Force

      # wintun.dll is required for TUN (full-device) mode; sing-box loads it from
      # beside the core. Proxy mode (the default) doesn't need it.
      - name: Bundle wintun.dll next to the app
        run: Copy-Item assets/bin/wintun.dll -Destination build/windows/x64/runner/Release/ -Force

      # libcronet.dll is Chromium's network stack, which the core loads (lazily,
      # from beside itself) for NaiveProxy servers. The Windows core is built
      # with purego so the Go side stays cross-compilable; the DLL is the native
      # half. See tool/core/build-desktop.sh. Without it a NaiveProxy server
      # fails with "cronet: library not found"; every other protocol is unaffected.
      - name: Bundle libcronet.dll next to the app
        run: Copy-Item assets/bin/libcronet.dll -Destination build/windows/x64/runner/Release/ -Force

      - name: Package Nova-Windows.zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Nova-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows
          path: Nova-Windows.zip
          if-no-files-found: error

      # On a v* tag, attach the Windows build to the public IRNova release, next
      # to the APK and macOS builds. Notes come from the CHANGELOG section for the
      # tag (same body the APK job writes), via the IRNOVA_TOKEN PAT.
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash tool/release_notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > notes.md

      - name: Attach Windows build to the IRNova release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: IRNova/Nova-Client
          token: ${{ secrets.IRNOVA_TOKEN }}
          files: Nova-Windows.zip
          body_path: notes.md
          generate_release_notes: false
