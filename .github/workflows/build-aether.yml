# Builds the Aether WARP core as a native library for Android.
#
# Aether is a second core, like Xray: it opens a MASQUE or WireGuard tunnel and
# serves it as a local SOCKS5 proxy that sing-box forwards into. Nova links its
# C API rather than spawning it, so what this produces is libaether.so per ABI.
#
# Built from source at a pinned commit, not downloaded from their releases.
# Nova ships circumvention software into Iran and already holds sing-box to
# build-from-source with a pinned patch hash; a prebuilt binary nobody here
# compiled is the wrong exception to make. The pin also means an upstream force
# push cannot silently change what we ship.
#
# Deliberately manual. A full Rust + NDK build is slow and the core changes on
# its own schedule, so it runs when someone asks for it and the artifacts are
# committed, the same way libbox.aar is.
name: Build Aether core

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Aether commit or tag to build (defaults to the pinned one)"
        required: false
        default: ""

env:
  # v1.9.0, 2026-09-04. Bump deliberately: read what changed in the FFI first,
  # because the Dart binding names these symbols and a rename fails at runtime
  # with nothing more useful than "symbol not found".
  AETHER_COMMIT: 311b573352bb67e494895ff67d20b002d075116a
  NDK_VERSION: r26d

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - name: Check out Aether at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ github.event.inputs.ref || env.AETHER_COMMIT }}
          persist-credentials: false

      - name: Say what was actually checked out
        run: |
          set -euxo pipefail
          git log -1 --format='%H %ci %s'
          # quiche is vendored in the tree rather than a submodule, and the
          # crate depends on it by relative path. A checkout without it builds
          # nothing, so fail here rather than 20 minutes into cargo.
          test -d quiche || { echo "quiche is missing from the checkout"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the shared library
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        # No --features tor: the pluggable transports pull in a Go toolchain and
        # a large dependency tree for bridges Nova does not offer.
        run: cargo ndk -t ${{ matrix.abi }} --platform 24 build --release

      - name: Prove the library exports what the Dart binding calls
        working-directory: aether
        run: |
          set -euo pipefail
          SO="target/${{ matrix.target }}/release/libaether.so"
          test -f "$SO" || { echo "no libaether.so was produced"; exit 1; }
          ls -l "$SO"
          # The binding resolves these by name at runtime. A missing one is a
          # crash on first use with no useful message, so it is checked here
          # where the failure is cheap and obvious.
          # --dynamic, not the default table. A release build strips the
          # static symbols, so plain nm reports "no symbols" on a library whose
          # exports are perfectly fine. What dlsym resolves against is the
          # DYNAMIC table, so that is what has to be inspected; checking the
          # wrong one fails a good build and would pass a stripped bad one.
          NM="$(find "$ANDROID_NDK_HOME" -name 'llvm-nm' | head -1)"
          test -n "$NM" || { echo "llvm-nm not found in the NDK"; exit 1; }
          "$NM" --dynamic --defined-only "$SO" > /tmp/syms.txt
          echo "exported symbols: $(wc -l < /tmp/syms.txt)"
          for sym in aether_version aether_identity_open aether_scan_start \
                     aether_verify_start aether_tunnel_start aether_job_poll \
                     aether_job_cancel aether_string_free; do
            grep -qE "[[:space:]][TtWw][[:space:]]$sym\$" /tmp/syms.txt \
              || { echo "missing export: $sym"; grep -c . /tmp/syms.txt; exit 1; }
          done
          echo "all expected symbols are exported"
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libaether-${{ matrix.abi }}
          path: aether/target/${{ matrix.target }}/release/libaether.so
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Desktop. Same core, same pinned commit, built as a shared library
  # rather than the CLI binary upstream ships, because Nova links it.
  #
  # macOS is built for both architectures and merged with lipo: Nova's
  # macOS build is universal, and shipping one slice would fail at load
  # on the other kind of Mac with nothing but a dlopen error to show.
  # ------------------------------------------------------------------
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            out: libaether.dylib
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            out: libaether.so
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            out: aether.dll
    steps:
      - name: Check out Aether at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ github.event.inputs.ref || env.AETHER_COMMIT }}
          persist-credentials: false

      - name: Confirm quiche came with it
        shell: bash
        run: test -d quiche || { echo "quiche is missing from the checkout"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add targets
        shell: bash
        run: for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM (BoringSSL needs it on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1


      - name: Build
        shell: bash
        working-directory: aether
        run: for t in ${{ matrix.targets }}; do cargo build --release --target "$t"; done

      - name: Collect the library
        shell: bash
        working-directory: aether
        run: |
          set -euo pipefail
          mkdir -p ../dist
          read -r -a TARGETS <<< "${{ matrix.targets }}"
          if [ "${#TARGETS[@]}" -gt 1 ]; then
            # Universal: one file that loads on both kinds of Mac.
            lipo -create -output "../dist/${{ matrix.out }}" \
              $(for t in "${TARGETS[@]}"; do echo "target/$t/release/${{ matrix.out }}"; done)
            lipo -info "../dist/${{ matrix.out }}"
          else
            cp "target/${TARGETS[0]}/release/${{ matrix.out }}" "../dist/${{ matrix.out }}"
          fi
          ls -l "../dist/${{ matrix.out }}"

      - name: Write the PE export reader
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/pe_exports.py" <<'PYEOF'
          # Prints the exported names of a PE/DLL. Standard library only: the
          # point is to depend on nothing the build might disagree with.
          import struct, sys

          def exports(path):
              d = open(path, 'rb').read()
              pe = struct.unpack_from('<I', d, 0x3C)[0]
              if d[pe:pe + 4] != b'PE\0\0':
                  raise SystemExit('not a PE file')
              nsec, = struct.unpack_from('<H', d, pe + 6)
              opt, = struct.unpack_from('<H', d, pe + 20)
              magic, = struct.unpack_from('<H', d, pe + 24)
              # The export directory is the first data directory; where it sits
              # depends on whether this is PE32 or PE32+.
              dd = pe + 24 + (112 if magic == 0x20b else 96)
              rva, _size = struct.unpack_from('<II', d, dd)
              if rva == 0:
                  return []
              secs = pe + 24 + opt
              def to_off(r):
                  for i in range(nsec):
                      s = secs + 40 * i
                      va, vsz = struct.unpack_from('<II', d, s + 12)[0], struct.unpack_from('<I', d, s + 8)[0]
                      raw = struct.unpack_from('<I', d, s + 20)[0]
                      if va <= r < va + max(vsz, 1):
                          return raw + (r - va)
                  raise SystemExit('rva %#x is outside every section' % r)
              e = to_off(rva)
              n_names, = struct.unpack_from('<I', d, e + 24)
              names_rva, = struct.unpack_from('<I', d, e + 32)
              out = []
              base = to_off(names_rva)
              for i in range(n_names):
                  nr, = struct.unpack_from('<I', d, base + 4 * i)
                  o = to_off(nr)
                  out.append(d[o:d.index(b'\0', o)].decode('ascii', 'replace'))
              return out

          for name in exports(sys.argv[1]):
              print(name)
          PYEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/pe_exports.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/pe_exports.py"
          echo "parser written and parses"

      - name: Prove the exports are there
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          OUT="${{ matrix.out }}"
          # A missing export is a crash on first use whose only message is that
          # a symbol was not found, so it is worth catching here.
          #
          # Windows reads the PE export table in Python rather than shelling out
          # to dumpbin. dumpbin is an MSVC tool absent from a plain bash PATH,
          # and the obvious fix, loading the developer environment, reconfigured
          # the toolchain cargo had already set up correctly and broke the build
          # itself. A parser with no toolchain dependency cannot do that.
          case "${{ runner.os }}" in
            macOS)   nm -gU "$OUT" > syms.txt ;;
            Linux)   nm --dynamic --defined-only "$OUT" > syms.txt ;;
            Windows) python3 "$GITHUB_WORKSPACE/pe_exports.py" "$OUT" > syms.txt ;;
          esac
          test -s syms.txt || { echo "no symbols could be listed at all"; exit 1; }
          for sym in aether_version aether_identity_open aether_scan_start \
                     aether_verify_start aether_tunnel_start aether_job_poll \
                     aether_job_cancel aether_string_free; do
            grep -q "$sym" syms.txt || { echo "missing export: $sym"; exit 1; }
          done
          echo "all expected symbols are exported"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.name }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error
