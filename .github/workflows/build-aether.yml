# Builds the Aether WARP core as a native library for Android.
#
# Aether is a second core, like Xray: it opens a MASQUE or WireGuard tunnel and
# serves it as a local SOCKS5 proxy that sing-box forwards into. Nova links its
# C API rather than spawning it, so what this produces is libaether.so per ABI.
#
# Built from source at a pinned commit, not downloaded from their releases.
# Nova ships circumvention software into Iran and already holds sing-box to
# build-from-source with a pinned patch hash; a prebuilt binary nobody here
# compiled is the wrong exception to make. The pin also means an upstream force
# push cannot silently change what we ship.
#
# Deliberately manual. A full Rust + NDK build is slow and the core changes on
# its own schedule, so it runs when someone asks for it and the artifacts are
# committed, the same way libbox.aar is.
name: Build Aether core

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Aether commit or tag to build (defaults to the pinned one)"
        required: false
        default: ""

env:
  # v1.9.0, 2026-09-04. Bump deliberately: read what changed in the FFI first,
  # because the Dart binding names these symbols and a rename fails at runtime
  # with nothing more useful than "symbol not found".
  AETHER_COMMIT: 311b573352bb67e494895ff67d20b002d075116a
  NDK_VERSION: r26d

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - name: Check out Aether at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ github.event.inputs.ref || env.AETHER_COMMIT }}
          persist-credentials: false

      - name: Say what was actually checked out
        run: |
          set -euxo pipefail
          git log -1 --format='%H %ci %s'
          # quiche is vendored in the tree rather than a submodule, and the
          # crate depends on it by relative path. A checkout without it builds
          # nothing, so fail here rather than 20 minutes into cargo.
          test -d quiche || { echo "quiche is missing from the checkout"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the shared library
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        # No --features tor: the pluggable transports pull in a Go toolchain and
        # a large dependency tree for bridges Nova does not offer.
        run: cargo ndk -t ${{ matrix.abi }} --platform 24 build --release

      - name: Prove the library exports what the Dart binding calls
        working-directory: aether
        run: |
          set -euo pipefail
          SO="target/${{ matrix.target }}/release/libaether.so"
          test -f "$SO" || { echo "no libaether.so was produced"; exit 1; }
          ls -l "$SO"
          # The binding resolves these by name at runtime. A missing one is a
          # crash on first use with no useful message, so it is checked here
          # where the failure is cheap and obvious.
          # --dynamic, not the default table. A release build strips the
          # static symbols, so plain nm reports "no symbols" on a library whose
          # exports are perfectly fine. What dlsym resolves against is the
          # DYNAMIC table, so that is what has to be inspected; checking the
          # wrong one fails a good build and would pass a stripped bad one.
          NM="$(find "$ANDROID_NDK_HOME" -name 'llvm-nm' | head -1)"
          test -n "$NM" || { echo "llvm-nm not found in the NDK"; exit 1; }
          "$NM" --dynamic --defined-only "$SO" > /tmp/syms.txt
          echo "exported symbols: $(wc -l < /tmp/syms.txt)"
          for sym in aether_version aether_identity_open aether_scan_start \
                     aether_verify_start aether_tunnel_start aether_job_poll \
                     aether_job_cancel aether_string_free; do
            grep -qE "[[:space:]][TtWw][[:space:]]$sym\$" /tmp/syms.txt \
              || { echo "missing export: $sym"; grep -c . /tmp/syms.txt; exit 1; }
          done
          echo "all expected symbols are exported"
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libaether-${{ matrix.abi }}
          path: aether/target/${{ matrix.target }}/release/libaether.so
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Desktop. Same core, same pinned commit, built as a shared library
  # rather than the CLI binary upstream ships, because Nova links it.
  #
  # macOS is built for both architectures and merged with lipo: Nova's
  # macOS build is universal, and shipping one slice would fail at load
  # on the other kind of Mac with nothing but a dlopen error to show.
  # ------------------------------------------------------------------
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            out: libaether.dylib
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            out: libaether.so
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            out: aether.dll
    steps:
      - name: Check out Aether at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ github.event.inputs.ref || env.AETHER_COMMIT }}
          persist-credentials: false

      - name: Confirm quiche came with it
        shell: bash
        run: test -d quiche || { echo "quiche is missing from the checkout"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add targets
        shell: bash
        run: for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM (BoringSSL needs it on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1


      - name: Build
        shell: bash
        working-directory: aether
        run: for t in ${{ matrix.targets }}; do cargo build --release --target "$t"; done

      - name: Collect the library
        shell: bash
        working-directory: aether
        run: |
          set -euo pipefail
          mkdir -p ../dist
          read -r -a TARGETS <<< "${{ matrix.targets }}"
          if [ "${#TARGETS[@]}" -gt 1 ]; then
            # Universal: one file that loads on both kinds of Mac.
            lipo -create -output "../dist/${{ matrix.out }}" \
              $(for t in "${TARGETS[@]}"; do echo "target/$t/release/${{ matrix.out }}"; done)
            lipo -info "../dist/${{ matrix.out }}"
          else
            cp "target/${TARGETS[0]}/release/${{ matrix.out }}" "../dist/${{ matrix.out }}"
          fi
          ls -l "../dist/${{ matrix.out }}"

      # The job checks out Aether, not this repo, so the reader has to be
      # fetched deliberately. Sparse: one file, not the whole client.
      - name: Fetch the PE export reader
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          path: nova-tools
          sparse-checkout: tool/pe_exports.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prove the exports are there
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          OUT="${{ matrix.out }}"
          # A missing export is a crash on first use whose only message is that
          # a symbol was not found, so it is worth catching here.
          #
          # Windows reads the PE export table in Python rather than shelling out
          # to dumpbin. dumpbin is an MSVC tool absent from a plain bash PATH,
          # and the obvious fix, loading the developer environment, reconfigured
          # the toolchain cargo had already set up correctly and broke the build
          # itself. A parser with no toolchain dependency cannot do that.
          case "${{ runner.os }}" in
            macOS)   nm -gU "$OUT" > syms.txt ;;
            Linux)   nm --dynamic --defined-only "$OUT" > syms.txt ;;
            Windows) python "$GITHUB_WORKSPACE/nova-tools/tool/pe_exports.py" "$OUT" > syms.txt ;;
          esac
          test -s syms.txt || { echo "no symbols could be listed at all"; exit 1; }
          for sym in aether_version aether_identity_open aether_scan_start \
                     aether_verify_start aether_tunnel_start aether_job_poll \
                     aether_job_cancel aether_string_free; do
            grep -q "$sym" syms.txt || { echo "missing export: $sym"; exit 1; }
          done
          echo "all expected symbols are exported"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.name }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # iOS. A static library, not a dylib, and an xcframework around it.
  #
  # iOS is the one platform where the core cannot live in the app process.
  # The VPN runs in a Network Extension, a separate process that keeps running
  # when the app is backgrounded, and an app-hosted core would be suspended
  # with the app and take the tunnel down. So this is linked into the extension
  # the way Novacore already is, which means a static archive rather than
  # something dlopen'd at runtime.
  #
  # Device and simulator are separate slices and must stay separate: an
  # xcframework is exactly the container for that, and lipo cannot merge them
  # because both are arm64.
  # ------------------------------------------------------------------
  ios:
    name: ios-xcframework
    runs-on: macos-latest
    steps:
      - name: Check out Aether at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ github.event.inputs.ref || env.AETHER_COMMIT }}
          persist-credentials: false

      - name: Confirm quiche came with it
        run: test -d quiche || { echo "quiche is missing from the checkout"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Build each slice
        working-directory: aether
        env:
          # Rust defaults the iOS minimum to something ancient, and the link
          # then looks for BoringSSL's stack probe in a libSystem stub that
          # predates it: "Undefined symbols: ___chkstk_darwin". Pinned to the
          # app's own minimum, which is what the Podfile declares.
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            echo "::group::$t"
            # Static library only. The crate also declares a cdylib, and
            # building it was what failed above: iOS cannot load a loose dylib
            # anyway, so linking one is work that can only produce errors.
            cargo rustc --release --target "$t" --lib --crate-type staticlib
            echo "::endgroup::"
          done

      - name: Hide everything but the entry points
        working-directory: aether
        run: |
          set -euo pipefail
          # The app and the Network Extension already contain a BoringSSL, the
          # one inside cronet inside the sing-box core. This archive carries
          # another, from quiche. Linked as-is they do not coexist: static
          # archive resolution binds quiche's calls to whichever _SSL_free was
          # already defined, so one library ends up driving the other's SSL
          # objects, with a different struct layout and a different allocator.
          #
          # That is not theoretical. It crashed a tester's phone on build 148:
          # SSL_free -> ~ssl_st -> ~SSL_CONFIG -> OPENSSL_free on a pointer read
          # at the wrong offset (0xfffffffffffffff9), inside cronet's socket
          # teardown, in an app binary that had exactly one _SSL_free for two
          # BoringSSLs.
          #
          # So each slice is partially linked into a single object with only the
          # twelve entry points left global. Everything else, crypto included,
          # becomes local: it cannot interpose on the host's symbols and the
          # host's cannot interpose on it. Each library keeps its own BoringSSL.
          cat > /tmp/aether_keep.txt <<'KEEP'
          _aether_version
          _aether_string_free
          _aether_job_poll
          _aether_job_cancel
          _aether_job_free
          _aether_identity_open
          _aether_identity_summary
          _aether_identity_free
          _aether_scan_start
          _aether_verify_start
          _aether_tunnel_start
          _aether_core_start
          KEEP
          # -u per entry point, never -force_load. The archive carries TWO
          # BoringSSL builds (quiche vendors one, the boring crate another), so
          # pulling every object in duplicates thousands of symbols; that is how
          # the first attempt at linking this into the app failed. Naming the
          # entry points pulls their objects and whatever they reach, and each
          # BoringSSL symbol resolves once.
          UFLAGS=""
          while read -r sym; do
            [ -n "$sym" ] && UFLAGS="$UFLAGS -u $sym"
          done < /tmp/aether_keep.txt
          hide() {
            local arch="$1" inlib="$2" out="$3"
            # -r keeps it relocatable; with an exported list, every global not
            # named is demoted to local.
            ld -r -arch "$arch" $UFLAGS \
              -exported_symbols_list /tmp/aether_keep.txt \
              -o "$out.o" "$inlib"
            libtool -static -o "$out" "$out.o"
            rm -f "$out.o"
          }
          mkdir -p ../dist/device ../dist/sim ../dist/include
          hide arm64 target/aarch64-apple-ios/release/libaether.a ../dist/device/libaether.a
          hide arm64 target/aarch64-apple-ios-sim/release/libaether.a /tmp/sim-arm64.a
          hide x86_64 target/x86_64-apple-ios/release/libaether.a /tmp/sim-x86.a
          lipo -create -output ../dist/sim/libaether.a /tmp/sim-arm64.a /tmp/sim-x86.a
          lipo -info ../dist/device/libaether.a ../dist/sim/libaether.a

      - name: Prove no crypto symbol escaped
        run: |
          set -euo pipefail
          # The whole point of the step above. A single leaked BoringSSL global
          # is enough to reintroduce the crash, so this counts rather than
          # trusts: the only globals may be the aether entry points.
          for lib in dist/device/libaether.a dist/sim/libaether.a; do
            LEAKED="$(nm -g "$lib" 2>/dev/null \
              | awk '$2 ~ /^[TDBS]$/ {print $3}' \
              | grep -v '^_aether_' | sort -u || true)"
            if [ -n "$LEAKED" ]; then
              echo "!! $lib exports symbols that are not entry points:"
              echo "$LEAKED" | head -20
              echo "   ($(echo "$LEAKED" | wc -l) in total)"
              exit 1
            fi
            echo "$lib: nothing global but the entry points"
          done

      - name: Assemble the xcframework
        run: |
          set -euo pipefail
          mkdir -p dist/include

          # The crate ships no C header, so the one Swift imports is written
          # here from its FFI. Every function returns a malloc'd JSON string
          # that the caller frees with aether_string_free.
          cat > dist/include/aether.h <<'HDR'
          #ifndef AETHER_H
          #define AETHER_H
          #include <stdint.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          char *aether_version(void);
          void aether_string_free(char *raw);
          char *aether_job_poll(uint64_t id);
          char *aether_job_cancel(uint64_t id);
          char *aether_job_free(uint64_t id);
          char *aether_identity_open(const char *payload);
          char *aether_identity_summary(uint64_t id);
          char *aether_identity_free(uint64_t id);
          char *aether_scan_start(uint64_t identity, const char *payload);
          char *aether_verify_start(uint64_t identity, const char *payload);
          char *aether_tunnel_start(uint64_t identity, const char *payload);
          char *aether_core_start(const char *arguments);
          #ifdef __cplusplus
          }
          #endif
          #endif
          HDR
          cat > dist/include/module.modulemap <<'MOD'
          module Aether {
            header "aether.h"
            export *
          }
          MOD
          cp -R dist/include dist/device-include
          cp -R dist/include dist/sim-include

          xcodebuild -create-xcframework \
            -library dist/device/libaether.a -headers dist/device-include \
            -library dist/sim/libaether.a -headers dist/sim-include \
            -output dist/Aether.xcframework
          find dist/Aether.xcframework -maxdepth 2

      - name: Prove the exports are there
        run: |
          set -euo pipefail
          # A missing export is a link error in the extension, or worse a crash
          # on first use. Checked on both slices: a simulator-only symbol would
          # pass a desk test and fail on a phone.
          for lib in dist/device/libaether.a dist/sim/libaether.a; do
            nm -g "$lib" 2>/dev/null | grep -E '^[0-9a-f]* [TD] _aether_' > "syms-$(basename $(dirname $lib)).txt" || true
            f="syms-$(basename $(dirname $lib)).txt"
            test -s "$f" || { echo "no aether symbols in $lib"; exit 1; }
            for sym in aether_version aether_identity_open aether_scan_start \
                       aether_verify_start aether_tunnel_start aether_job_poll \
                       aether_job_cancel aether_string_free; do
              grep -q "_$sym$" "$f" || { echo "missing export in $lib: $sym"; exit 1; }
            done
            echo "$lib: all expected symbols are exported"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aether-ios-xcframework
          path: dist/Aether.xcframework
          if-no-files-found: error
