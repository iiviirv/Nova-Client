name: nova_client
description: >-
  Nova Client — an optimised, Nova-branded proxy client (a streamlined Karing
  fork) with the Nova Radar Cloudflare clean-IP scanner built in. Follows the
  Nova Proxy design language.
publish_to: "none"
version: 0.2.0+5

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Persistence for profiles, radar sources/ports and theme/locale.
  shared_preferences: ^2.2.0

  # Opening the Nova Proxy links from Settings.
  url_launcher: ^6.2.0

  # Desktop proxy core: manage the bundled sing-box process and read its
  # Clash API for live traffic stats.
  http: ^1.2.0
  path_provider: ^2.1.0

  # Cloudflare OAuth (PKCE) + the Workers deploy multipart upload.
  crypto: ^3.0.0
  http_parser: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/bin/

  # The Nova design language uses Inter (Latin) and Vazirmatn (Farsi). The app
  # falls back to system fonts when these files are absent, so shipping them is
  # optional. To embed the exact brand fonts, drop the .ttf files under
  # assets/fonts/ and uncomment:
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
