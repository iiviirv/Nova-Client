<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="novaTitle novaDesc" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, system-ui, sans-serif">
  <title id="novaTitle">Nova</title>
  <desc id="novaDesc">Nova. Fast, free, unrestricted internet, built for Iran. A VPN client for iOS, Android, macOS and Windows.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0912"/>
      <stop offset="0.55" stop-color="#100c24"/>
      <stop offset="1" stop-color="#181038"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e7deff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="burstCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c7b6ff"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- ambient glow behind the mark -->
  <ellipse cx="380" cy="200" rx="520" ry="340" fill="url(#glow)"/>
  <ellipse cx="1015" cy="200" rx="300" ry="280" fill="url(#glow)" opacity="0.5"/>

  <!-- starfield -->
  <g fill="#c9c2f0">
    <circle cx="120" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="240" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="70" cy="250" r="1.4" opacity="0.6"/>
    <circle cx="470" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="640" cy="300" r="1.5" opacity="0.55"/>
    <circle cx="820" cy="70" r="1.3" opacity="0.6"/>
    <circle cx="1120" cy="300" r="1.6" opacity="0.6"/>
    <circle cx="1180" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="560" cy="120" r="1" opacity="0.4"/>
    <circle cx="960" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="1240" cy="240" r="1.3" opacity="0.5"/>
    <circle cx="330" cy="150" r="1" opacity="0.4"/>
  </g>

  <!-- nova burst, right side -->
  <g transform="translate(1015 200)">
    <circle r="132" fill="url(#burstCore)"/>
    <g stroke="#d9ccff" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-158" x2="0" y2="-58"/>
      <line x1="0" y1="158" x2="0" y2="58"/>
      <line x1="-158" y1="0" x2="-58" y2="0"/>
      <line x1="158" y1="0" x2="58" y2="0"/>
    </g>
    <g stroke="#8f79ff" stroke-width="2.5" stroke-linecap="round">
      <line x1="-108" y1="-108" x2="-44" y2="-44"/>
      <line x1="108" y1="-108" x2="44" y2="-44"/>
      <line x1="-108" y1="108" x2="-44" y2="44"/>
      <line x1="108" y1="108" x2="44" y2="44"/>
    </g>
    <path d="M0 -46 L12 -12 L46 0 L12 12 L0 46 L-12 12 L-46 0 L-12 -12 Z" fill="#ffffff"/>
    <path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#7c5cff"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="212" font-size="150" font-weight="800" letter-spacing="-4" fill="url(#word)">Nova</text>

  <!-- accent underline -->
  <rect x="102" y="238" width="196" height="6" rx="3" fill="url(#accentLine)"/>

  <!-- tagline -->
  <text x="104" y="290" font-size="34" font-weight="600" fill="#efecff">Fast, free, unrestricted internet,</text>
  <text x="104" y="332" font-size="34" font-weight="600" fill="#b9b3d4">built for Iran.</text>

  <!-- platform line -->
  <g fill="#8a83ad">
    <text x="104" y="372" font-size="18" font-weight="600" letter-spacing="3">iOS</text>
    <text x="196" y="372" font-size="18" font-weight="600" letter-spacing="3">ANDROID</text>
    <text x="356" y="372" font-size="18" font-weight="600" letter-spacing="3">macOS</text>
    <text x="480" y="372" font-size="18" font-weight="600" letter-spacing="3">WINDOWS</text>
  </g>
  <g fill="#5b5480">
    <circle cx="174" cy="366" r="2.2"/>
    <circle cx="330" cy="366" r="2.2"/>
    <circle cx="452" cy="366" r="2.2"/>
  </g>
</svg>
